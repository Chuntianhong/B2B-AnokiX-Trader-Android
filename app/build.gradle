plugins {
    id 'com.android.application'
    // Reads google-services.json and generates Firebase config resources.
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.anokix.traderapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.anokix.traderapp"
        minSdk 24
        targetSdk 34
        versionCode 104
        versionName "1.0.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Networking: OkHttp transport + Gson for JSON parsing (no Retrofit)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Image loading + caching
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Banner / promotion video streaming
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // Google Maps (store geolocation picker)
    implementation 'com.google.android.gms:play-services-maps:18.2.0'

    // Country code picker (phone country selector with flags + search)
    implementation 'com.hbb20:ccp:2.7.3'

    // Firebase Cloud Messaging (push notifications). The BoM pins compatible
    // versions so firebase-messaging needs no explicit version.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
